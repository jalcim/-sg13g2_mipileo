# LVS de puce : plots, bondpad et macros extraits en cellules abstraites (boites noires), comme la livraison 1
# (061, ee396f4) et TPU9012 ; netgen compare les connexions a leurs broches. Coquilles .subckt vides dans
# coquilles_lvs.spice (scripts/coquilles_lvs.py). Le LVS interne des plots et des macros releve de leurs auteurs.
MAGIC_EXT_ABSTRACT_CELLS:
- "^MIPI_.*"
- "^bondpad_70x70_novias$"
- "^csi2_top$"
- "^dphy_(rx|tx)$"
- "^sr16_(rx4|tx)$"
- "^cml_to_cmos$"
- "^cmos_to_cml$"
- "^cml_gate2$"
- "^hs_tx_pd$"
- "^iref$"
EXTRA_SPICE_MODELS:
- dir::coquilles_lvs.spice

# Sorties d application et de debogage de csi2_top libres (option B, renvoi en cours) et broches de dphy_rx /
# dphy_tx sans usage (clk_miss, term_en...) : le rapport reste, sans arreter le flot.
ERROR_ON_DISCONNECTED_PINS: false

# This is an alternative method compared to
# specifying the power connections in the RTL
PDN_MACRO_CONNECTIONS:
- "csi2_top VDD VSS VPWR VGND"
#- "suiveur VDD VSS VCC VSS"
#- "suiveur_flow VDD VSS VCC VSS"

MAGIC_GDS_FLATGLOB:
 # For DRC of SRAM macros
 - "lvsres_*"
 - "VIA_M1_*"
 - "VIA_M2_*"
 - "*_CELL_CORNER"
 - "RSC_*"
 - "*_CELL_SUB"
