meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable magic DRC
    #Magic.DRC: null
    #Checker.MagicDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null
    
    # Save time
    #OpenROAD.IRDropReport: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

    # Use Magic.Filler instead of KLayout.Filler
    # This can help in some cases where the target
    # density cannot be met using KLayout.
    #KLayout.Filler: Magic.Filler

# MSPHY5973 : flot de Leo (LibreLane dev aaf7a93), PDK du projet (/opt/nebula-eda/IHP-Open-PDK
# cfc0e22b + correctif HBT), passe par --pdk-root. Cablage : doc/cablage_msphy5973.md.
DESIGN_NAME: MSPHY5973
VERILOG_FILES:
- dir::../src/MSPHY5973.v

VERILOG_DEFINES: [FUNCTIONAL]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Pads
PAD_CFG: dir::pad_cfg.tcl
# Pas des ecarts entre plots : 2 um, pour que la marge de chaque cote tombe sur un site entier
# (ouest et sud a 6 plots sur 2 560 : 1 um donnait 207,5, refuse par pad_cfg.tcl ; coupe2)
PAD_SPACING_MULTIPLE: 2

# Specify the pad instances for the padring

#MIPI RX : 13 pads
# VDDIO MIPI 
# VSSIO_MIPI
# ANALOG PAD (current setting)
# CLK Lane P
# CLK Lane N
# RX1 Lane P
# RX1 Lane N
# RX2 Lane P
# RX2 Lane N
# RX3 Lane P
# RX3 Lane N
# RX4 Lane P
# RX4 Lane N

# Brochage : doc/cablage_msphy5973.md (lanes numerotees depuis 0)
PAD_EAST: [
  iovdd_mipi_pad, iovss_mipi_pad, vdd_e_pad, vss_e_pad, bandgap_pad,
  rx_clk_p_pad, rx_clk_n_pad,
  rx_d0_p_pad, rx_d0_n_pad, rx_d1_p_pad, rx_d1_n_pad,
  rx_d2_p_pad, rx_d2_n_pad, rx_d3_p_pad, rx_d3_n_pad
]

PAD_NORTH: [
  vdd_pad, vss_pad,
  tx_clk_p_pad, tx_clk_n_pad,
  tx_d0_p_pad, tx_d0_n_pad, tx_d1_p_pad, tx_d1_n_pad,
  tx_d2_p_pad, tx_d2_n_pad, tx_d3_p_pad, tx_d3_n_pad,
  tx_analog_pad, vdd_n_pad, vss_n_pad,
  clkin_i_n_pad, clkin_i_p_pad, clkin_q_n_pad, clkin_q_p_pad
]

PAD_WEST: [
  iovdd_pad, iovss_pad,
  clk_sys_pad, rst_n_pad,
  renvoi_mode0_pad, renvoi_mode1_pad
]

PAD_SOUTH: [
  vdd_s_pad, vss_s_pad,
  en0_pad, en1_pad, en2_pad, en3_pad
]

# SDC files
PNR_SDC_FILE: dir::chip_top_comb.sdc
SIGNOFF_SDC_FILE: dir::chip_top_comb.sdc
FALLBACK_SDC: dir::chip_top_comb.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# No clock
CLOCK_PORT: null
CLOCK_NET: null

# Periode de Clk Systeme (125,125 MHz), horloge virtuelle comme la livraison 1 (msphy4263.sdc) : les chemins de
# csi2_top sont contraints dans la macro, les plots numeriques attendent les retards de la carte.
CLOCK_PERIOD: 7.992

SETUP_VIOLATION_CORNERS: ["*"]

# Floorplanning
FP_SIZING: absolute

# Die PROVISOIRE de 2 560 um et positions des macros : plan de masse de la livraison 1
# (nebula:~/depots/p061_assemblage/plan.json, prompt-061, 29/09 17:49)
DIE_AREA: [0, 0, 2560, 2560]
CORE_AREA: [400.32, 400.68, 2159.52, 2158.38]

# Increase for more logic on your die
PL_TARGET_DENSITY_PCT: 10
GRT_ALLOW_CONGESTION: true

# Routing
RT_MAX_LAYER: Metal4

NON_DEFAULT_RULES:
  NDR_analog:
    # Chaines, pas nombres : la classe NDR de LibreLane declare List[str] et
    # refuse de convertir (« Refusing to automatically convert value »).
    width:   [Metal2, "1.2", Metal3, "1.2", Metal4, "1.2"]
    spacing: [Metal2, "0.6", Metal3, "0.6", Metal4, "0.6"]
    via: [Via1_DC1B, Via2_DC1B, Via3_XY]

  # Meme regle que la livraison 1 (061, e9f5807) pour les nets CML haute frequence.
  NDR_cml:
    width:   [Metal2, "0.6", Metal3, "0.6", Metal4, "0.6", Metal5, "0.6"]
    spacing: [Metal2, "0.4", Metal3, "0.4", Metal4, "0.4", Metal5, "0.4"]
    via: [Via1_DC1B, Via2_DC1B, Via3_DC1B, Via4_DC1B]

# DRT_ASSIGN_NDR : {expression reguliere de net: NDR} (drt.tcl). Lanes HS des plots vers sr16_rx4, horloges CML
# (RX coupee, CLKIN_I / CLKIN_Q), autorisation d horloge et sorties serie des sr16_tx.
DRT_ASSIGN_NDR:
  "^(rx_(clk|d[0-3])_[pn]_hs|cml_ckg_[pn]|cml_clk_rx_en_[pn]|clkin_[iq]_[pn]_hs|tx_dout_[pn]\\[[0-3]\\])$": NDR_cml

RSZ_DONT_TOUCH_RX: "^(tx_\\w+_(hsp|hsn|lpinp|lpinn)|sync_run\\d|gate_clk_lane|run_q\\d|clk_lane|clk_q|pg_(rx|tx))$"

# PDN
PDN_CORE_RING: True

# Override bondpad name
PAD_BONDPAD_NAME: bondpad_70x70_novias

# Bondpad is not yet included in the PDK
EXTRA_GDS:
- dir::../ip/sg13g2_bondpad_70x70_novias/gds/bondpad_70x70_novias.gds

EXTRA_LEFS:
- dir::../ip/sg13g2_bondpad_70x70_novias/lef/bondpad_70x70_novias.lef


# MIPI_ring I/Os

# Set IO pad information
PAD_CORNER: [MIPI_Corner] # MIPI_CornerStop, CORNER_Breaker
PAD_FILLERS:
- MIPI_Filler10000
- MIPI_Filler4000
- MIPI_Filler2000
- MIPI_Filler1000
- MIPI_Filler400
- MIPI_Filler200

PAD_BONDPAD_OFFSETS:
  "MIPI_IOPad(IOVdd|IOVss|Vdd|Vss|Analog|RX|TX|In|Out)": [5.0, -70.0]
  "MIPI_IOPadBandgap": [45.0, -70.0]

PAD_LEFS: [dir::../ip/CSI2_DPHY_RING/LEF/MIPI_ring.lef]
PAD_GDS: [dir::gen/MIPI_ring.gds]
PAD_VERILOG_MODELS: [dir::../ip/CSI2_DPHY_RING/HDL/MIPI_ring.v]

# Technology lib
LIB:
  "*_typ_1p20V_25C":
    - pdk_dir::libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib
    - pdk_dir::libs.ref/sg13g2_io/lib/sg13g2_io_typ_1p2V_3p3V_25C.lib
    - dir::../ip/CSI2_DPHY_RING/LIB/MIPI_ring_dummy.lib
  "*_fast_1p32V_m40C":
    - pdk_dir::libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_fast_1p32V_m40C.lib
    - pdk_dir::libs.ref/sg13g2_io/lib/sg13g2_io_fast_1p32V_3p6V_m40C.lib
    - dir::../ip/CSI2_DPHY_RING/LIB/MIPI_ring_dummy.lib
  "*_slow_1p08V_125C":
    - pdk_dir::libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_slow_1p08V_125C.lib
    - pdk_dir::libs.ref/sg13g2_io/lib/sg13g2_io_slow_1p08V_3p0V_125C.lib
    - dir::../ip/CSI2_DPHY_RING/LIB/MIPI_ring_dummy.lib

#PAD_SPICE_MODELS: ["pdk_dir::libs.ref/sg13g2_io/spice/sg13g2_io.spice"]
#PAD_CDLS: ["pdk_dir::libs.ref/sg13g2_io/cdl/sg13g2_io.cdl"]

# Use custom IO with padbare pin
#PAD_LEFS: dir::../ip/sg13g2_io_custom/sg13g2_io.lef
#PAD_VERILOG_MODELS: dir::../ip/sg13g2_io_custom/sg13g2_io.v

IGNORE_DISCONNECTED_MODULES:
- bondpad_70x70_novias
- remplissage_gatpoly

# Power Distribution Network

# Custom PDN config to connect to SRAMs
PDN_CFG: dir::pdn_cfg.tcl

# Match/overlap the SRAM PDN
PDN_HWIDTH: 6
PDN_HSPACING: 2.0
PDN_HOFFSET: 14
# TopMetal1 vertical au pas de 37,8 (IR, decision de la principale du 29/09 20:12-20:16 ; PDK : 75,6)
PDN_VPITCH: 37.8

# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 15
PDN_CORE_RING_HWIDTH: 15
# Ensure minimum spacing for long metals
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5

PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Reduce the macro halo
FP_MACRO_VERTICAL_HALO: 7.56
PDN_VERTICAL_HALO: 7.56

# GDS : librelane/gen/, produits par scripts/gds_uniques.sh (sous-cellules renommees <macro>__<cellule>, 42 homonymes
